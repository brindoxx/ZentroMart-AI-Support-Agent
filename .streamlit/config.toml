# Local-only capstone demo. Hosting and production authentication are Phase 15.
[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"

# Native dark theme adapted from Streamlit's bundled VS Code template; no remote fonts.
[theme]
base = "dark"
primaryColor = "#0F766E"
backgroundColor = "#0E1514"
secondaryBackgroundColor = "#1A2725"
textColor = "#E7EFED"
borderColor = "#3E5953"
linkColor = "#5EEAD4"
font = "sans-serif"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#121D1B"
secondaryBackgroundColor = "#22322F"
textColor = "#E7EFED"
borderColor = "#3E5953"
primaryColor = "#0F766E"
linkColor = "#5EEAD4"
