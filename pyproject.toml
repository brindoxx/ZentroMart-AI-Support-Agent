[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zetromart-ai-support-agent"
version = "0.1.0"
description = "A multilingual customer support capstone for the fictional retailer ZentroMart."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]
